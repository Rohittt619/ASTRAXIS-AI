name: ASTRAXIS-AI Automated CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: 🧪 Run Pytest & Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ui]"

      - name: 🔍 Run Pytest Unit & Integration Suite
        run: |
          PYTHONPATH=src pytest tests/ --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: 🚀 Run CLI Smoke Test
        run: |
          python -m astraxis.cli.main scan --backend synthetic
          python -m astraxis.cli.main payloads
          python -m astraxis.cli.main graph

  docker-build:
    name: 🐳 Verify Multi-Stage Docker Image Build
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          tags: astraxis-ai:latest
