[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astraxis"
version = "1.0.0"
description = "Autonomous Multi-Agent AI Red-Teaming, Exploit Simulation & Defense Sandbox Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ASTRAXIS Core Contributors"}
]
keywords = [
    "ai-red-teaming",
    "multi-agent-security",
    "exploit-simulation",
    "ai-governance",
    "adversarial-ai",
    "prompt-injection",
    "agent-sandbox"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.1",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "black>=23.3.0",
    "ruff>=0.0.270"
]
ui = [
    "streamlit>=1.35.0"
]

[project.scripts]
astraxis = "astraxis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
